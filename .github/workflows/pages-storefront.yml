name: Deploy storefront
# Pages is enabled with a workflow build. A push of this file republishes the storefront.

on:
  push:
    branches:
      - arena/01a0dab0-orca
    paths:
      - storefront/**
      - .github/workflows/pages-storefront.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload storefront
        uses: actions/upload-pages-artifact@v3
        with:
          path: storefront

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
